<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página não encontrada · Jarvis</title>
<meta name="robots" content="noindex">
<meta name="description" content="Este endereço não existe no Jarvis. Volte para a tela inicial.">
<!-- Página 404 do GitHub Pages. Ela é servida em QUALQUER caminho que não existe (inclusive em subpastas),
     então todos os endereços daqui são absolutos, a partir de /site-fisica/. Sem scripts de fora. -->
<link rel="icon" href="/site-fisica/assets/favicon.svg" type="image/svg+xml">
<style>
  :root{color-scheme:dark light}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#e6eaf2;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:520px;padding:32px 24px;text-align:center}
  svg{width:96px;height:96px}
  h1{font-size:26px;margin:18px 0 6px}
  p{color:#a3adbf;margin:8px 0}
  code{background:#161d28;border:1px solid #263043;border-radius:6px;padding:2px 6px;color:#e6eaf2;word-break:break-all}
  a.bt{display:inline-block;margin-top:18px;padding:10px 18px;border-radius:10px;background:#6ea8fe;color:#0d1117;font-weight:700;text-decoration:none}
  a.bt:hover,a.bt:focus{background:#a3c7ff}
  @media (prefers-color-scheme:light){body{background:#f5f6f9;color:#151a24}p{color:#4c5568}code{background:#fff;border-color:#dde2ea;color:#151a24}a.bt{background:#2f63d6;color:#fff}a.bt:hover,a.bt:focus{background:#1f4fb8}}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 64 64" role="img" aria-label="Planeta com anel, símbolo do Jarvis"><circle cx="32" cy="32" r="13" fill="#6ea8fe"/><ellipse cx="32" cy="32" rx="26" ry="8" transform="rotate(-20 32 32)" fill="none" stroke="#e8b04b" stroke-width="3.2"/></svg>
  <h1>Página não encontrada</h1>
  <p>O endereço <code id="onde"></code> não existe no Jarvis.</p>
  <p id="dica" hidden>Parece um endereço de tema escrito sem o <code>#</code>. O certo é <a id="certo" href="/site-fisica/"></a>.</p>
  <a class="bt" href="/site-fisica/">Ir para a tela inicial</a>
</main>
<script>
  /* Mostra o endereço pedido e, se ele parecer uma rota do site sem o "#", sugere o endereço certo. Não redireciona sozinho. */
  (function () {
    var base = "/site-fisica/", p = location.pathname, resto = p.indexOf(base) === 0 ? p.slice(base.length) : "";
    document.getElementById("onde").textContent = p;
    if (resto && /^[A-Za-z0-9\/_-]+$/.test(resto) && resto.indexOf(".") < 0) {
      var a = document.getElementById("certo"); a.href = base + "#/" + resto.replace(/\/$/, ""); a.textContent = a.href;
      document.getElementById("dica").hidden = false;
    }
  })();
</script>
</body>
</html>
