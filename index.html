<body>
<header class="topo">
  <nav class="abas" aria-label="Áreas">
    <a class="aba" data-area="fisica" href="#/inicio" aria-label="Física">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <ellipse cx="16" cy="16" rx="13" ry="5" style="stroke:var(--mC)"/>
      <ellipse cx="16" cy="16" rx="13" ry="5" transform="rotate(60 16 16)" style="stroke:var(--mA)"/>
      <ellipse cx="16" cy="16" rx="13" ry="5" transform="rotate(120 16 16)" style="stroke:var(--mU)"/>
      <circle cx="16" cy="16" r="2.4" fill="currentColor" stroke="none"/>
    </svg>Física</a>
    <a class="aba" data-area="calculo" href="#/calculo" aria-label="Cálculo">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M9.5 4.5c-1.8 0-2.3 1.6-2.6 3.6L5.2 23.9c-.3 2-.8 3.6-2.6 3.6" style="stroke:var(--mK1)" stroke-width="2.1" stroke-linecap="round"/>

      <circle cx="16" cy="16" r="2.6" fill="currentColor"/>
    </svg>Cálculo</a>
    <a class="aba" data-area="exp" href="#/experimentos" aria-label="Experimentos">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><line x1="6" y1="4" x2="26" y2="4" style="stroke:var(--ink3)" stroke-width="2"/><line x1="16" y1="4" x2="10" y2="16" style="stroke:currentColor" stroke-width="1.8"/><line x1="10" y1="16" x2="19" y2="25" style="stroke:currentColor" stroke-width="1.8"/><circle cx="10" cy="16" r="3" style="fill:var(--mA)"/><circle cx="19" cy="25" r="3.4" style="fill:var(--mU)"/></svg>Experimentos</a>
  </nav>
  <span class="versao" id="versao"></span>
  <span class="esp"></span>
  <nav><a href="#/inicio">Início</a><a href="#/sumario">Sumário</a><a href="#/legenda">Legenda</a></nav>

  <button class="btn-ic" id="bt-tema" title="Clarear / escurecer" aria-label="Alternar tema claro e escuro">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>

<aside class="menu">

  <div id="menu-mods"></div>
  <div class="rodape">
    <button id="bt-exp">⬇ Exportar progresso (.json)</button>
    <button id="bt-imp">⬆ Importar progresso</button>
    <input type="file" id="arq-imp" accept="application/json" hidden>
  </div>
</aside>

<main class="principal"><div class="pagina" id="pagina"></div></main>
